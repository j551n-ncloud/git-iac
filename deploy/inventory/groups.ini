; Group-of-groups topology only. Host membership lives in
; inventory/hosts.ini; this file just describes how groups relate.
;
; The ini inventory plugin parses each file in inventory/ on its own
; before merging, so a group used in a ":children" line must also be
; declared (even empty, as below) in *this* file - it can't only be
; declared in hosts.ini. Ansible still merges these into the same
; "staging"/"production" groups hosts.ini populates.
;
; "env" isn't targeted directly by anything (playbooks and CI select
; staging or production via --limit) - it exists so you have somewhere
; to put vars/relationships shared by every environment group without
; touching group_vars/all.yml. Add further nesting here as needed, e.g.
; splitting production into production_eu/production_us later.

[staging]

[production]

[env:children]
staging
production
