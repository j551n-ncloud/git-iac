; Hosts this pipeline actually deploys to - i.e. the ones with a stack.
; Deploy with DEPLOY_LIMIT=managed rather than =production: a play
; targets every host in scope and gathers facts on it, so including
; hosts that have nothing to manage AND are not bootstrapped (no deploy
; user or key yet) fails the run on unreachable hosts for no benefit.
;
; playbooks/preflight.yml asserts this group and the hosts that define
; stacks stay in sync, so this can't silently drift.
[managed]
host-a
host-b
host-c
tools

