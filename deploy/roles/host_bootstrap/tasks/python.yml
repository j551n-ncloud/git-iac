---
# Runs FIRST, from a gather_facts: false play, using `raw` - the only
# module that doesn't need a Python interpreter on the target. Several
# hosts in this fleet are Alpine and ship without Python at all, and
# without this every other module (including fact gathering) fails
# with "/usr/bin/python3: not found".

- name: Install python3 with whatever package manager is available
  ansible.builtin.raw: |
    set -e
    if command -v python3 >/dev/null 2>&1; then
      echo "python3 already present"
    elif command -v apk >/dev/null 2>&1; then
      apk add --no-cache python3
    elif command -v apt-get >/dev/null 2>&1; then
      apt-get update -qq && apt-get install -y -qq python3
    elif command -v yum >/dev/null 2>&1; then
      yum install -y python3
    else
      echo "No known package manager found to install python3" >&2
      exit 1
    fi
  register: py_bootstrap
  changed_when: "'already present' not in py_bootstrap.stdout"
