---
# Upper bounds are pinned deliberately: docker_compose_v2's parameters
# have shifted across community.docker majors, and an unbounded range
# means a future release could change deploy behaviour without any
# change in this repo.
collections:
  - name: community.docker
    version: ">=3.10.0,<6.0.0"
  - name: ansible.posix
    version: ">=1.5.0,<3.0.0"
