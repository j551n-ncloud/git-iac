[defaults]
inventory       = inventory/
roles_path      = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent

# Some ansible-core versions (2.17.x among them) ignore .ini files by
# default when auto-discovering inventory sources in a directory -
# which is exactly inventory/hosts.ini and inventory/groups.ini here.
# Pin the ignore list explicitly, without .ini, so this doesn't depend
# on whichever ansible-core version happens to run it.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry

[ssh_connection]
pipelining = True
