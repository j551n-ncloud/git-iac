---
# Daily check for submodules whose source has moved past the pointer
# here, opening a merge request per stale one that does the bump.
#
# A submodule only moves when someone bumps its gitlink, so a commit
# pushed straight to the source repo leaves this repo stale and nothing
# builds from it. This used to open an issue listing the commands to
# run by hand; the bump is now a ready-made MR instead, because the
# hand-run recipe named a SHA that went stale while the issue sat open
# and walked the pointer backwards (a stale pin).
#
# It opens a merge request and never commits to main. A push to main
# builds images, pushes to Harbor and writes to services/deploy, which
# is exactly what the workflow rules keep a timer away from; an MR
# reaches none of it, since merge request pipelines run `test` only.
# tests/test_pipeline.py holds both halves of that to account.
#
# Schedule: SCHEDULE_TASK=submodule-check. The job keeps that name so
# the existing schedule variable still matches - renaming it would make
# the schedule quietly create no pipeline at all.
#
# Needs no submodules checked out and no Docker - just git ls-remote,
# which for the private dashboard repo needs the SSH key.
submodule-check:
  stage: scan
  image: ghcr.io/example-org/build-ci-image:latest
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "submodule-check"'
  before_script:
    - eval "$(ssh-agent -s)" >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - install -m 600 "$GIT_SSH_PRIVATE_KEY" ~/.ssh/build_key
    - ssh-add ~/.ssh/build_key
    - ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
    - ssh-keyscan -p 2224 -t rsa,ed25519 ssh.gitlab.example.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - python3 scripts/bump_submodules.py
