[defaults]
inventory       = inventory/
roles_path      = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
# Inventory files are extensionless (inventory/##-name); .md keeps
# inventory/README.md out of parsing.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry

[ssh_connection]
pipelining = True
